<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Viet-Muong TTS Demo</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <h1>Viet-Muong Text-to-Speech Demo</h1>

    <p class="subtitle">
        Comparison of synthesized speech generated by different TTS models.
    </p>

    <table>

        <thead>

        <tr>
            <th>Model</th>
            <th>Transcript</th>
            <th>Audio</th>
        </tr>

        </thead>

        <tbody>

        <tr>

            <td class="model">
                Spark-TTS
            </td>

            <td class="text">
                Nhà có ba khẩu, một mẹ già hơn tám mươi tuổi.
            </td>

            <td class="audio">
                <audio controls preload="none">
                    <source src="audio/spark-tts.wav" type="audio/wav">
                </audio>
            </td>

        </tr>

        <tr>

            <td class="model">
                Tacotron2 + HiFiGAN
            </td>

            <td class="text">
                Xin chào địa phương.
            </td>

            <td class="audio">
                <audio controls preload="none">
                    <source src="audio/tacotron2-hifigan.wav" type="audio/wav">
                </audio>
            </td>

        </tr>

        </tbody>

    </table>

</div>

</body>
</html>
